<!doctype html>

<html>
  <head>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <form class="needs-validation" novalidate>
      <h1>Internship Form</h1>
      <div class="row">
        <div class="col mt-3">
          <label for="first-name-input">First Name</label>
          <input
            id="first-name-input"
            type="text"
            class="form-control"
            aria-label="First name"
            required
          />
		<div class="invalid-feedback">
	    First name required!=
		  </div>
			
        </div>
        <div class="col mt-3">
          <label for="last-name-input">Last Name</label>
          <input
            id="last-name-input"
            type="text"
            class="form-control"
            aria-label="Last name"
            required
          />
		<div class="invalid-feedback">Last name required!</div>
        </div>
        <div class="col mt-3">
          <label for="email-input">Email Address</label>
          <input
            id="email-input"
            type="email"
            class="form-control"
            aria-label="Last name"
            placeholder="xyz@gmail.com"
            required
          />
			<div class="invalid-feedback">Email required!</div>
        </div>
      </div>
      <div class="row">
        <div class="col mt-3">
          <label for="college-input">College</label>
          <input id="college-input" type="text" class="form-control" required />
       <div class="invalid-feedback">Please provide a valid college.</div>
		</div>
        <div class="col mt-3">
          <label for="grad-year-select">Graduation Year</label><br />
          <select class="form-select" id="grad-year-select" required>
            <option selected>Choose...</option>
            <option value="1">2020</option>
            <option value="2">2021</option>
            <option value="3">2022</option>
            <option value="4">2023</option>
          </select>
        </div>
        <div class="col mt-3">
          <label for="roll-no-input">Roll No.</label><br />
          <input id="roll-no-input" type="number" class="form-control" required />
			<div class="invalid-feedback">
				Please provide a valid Roll no.
			</div>
        </div>
      </div>
      <div class="row">
        <div class="mb-3 mt-3">
          <input type="checkbox" class="form-check-input" id="conditions-checkbox" required/>
          <label class="form-check-label" for="exampleCheck1" id="conditions-checkbox">Agree to terms and conditions</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit form</button>
    </form>
    <script type="text/javascript" src="./script.js"></script>
  </body>
</html>
